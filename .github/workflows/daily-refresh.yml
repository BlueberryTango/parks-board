name: Daily Claude refresh

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx claude -p "Review the park grant dashboard in index.html and update it if any content is stale or needs refreshing. Preserve the current design and structure, keep the report readable, and save the updated result back to index.html."

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily Claude refresh"
          git push
